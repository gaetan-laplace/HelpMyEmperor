            darkMode: 'class',

                extend: {
                    fontFamily: {
                        display: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],

                        royalGold: '#d4af37',
                        royalGoldLight: '#f3d570',

    <style>

            width: 8px;

            background: #0f131a;
        }

            background: #283244;

        }

        }

            from { opacity: 0; transform: translateY(6px); }

                    <p class="text-xs text-slate-400 hidden sm:block">Encyclopédie Tactique • 25 Civilisations & Build Orders</p>

                </div>
            </div>
        </div>
    </div>

        // Toast Notification (Remplace alert())
        function showToast(message, type = "success") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            const colors = type === "success" 
                ? "bg-slateCard border-emeraldAccent/60 text-emerald-300" 
                : "bg-slateCard border-royalGold/60 text-royalGoldLight";
            
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl border shadow-xl text-sm font-medium animate-fade-in ${colors}`;
            toast.innerHTML = `<i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateY(6px)";
                toast.style.transition = "all 0.25s ease";
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        // Rendu des étoiles de difficulté
        function renderStars(level) {
            let html = "";
            for (let i = 1; i <= 3; i++) {
                html += i <= level 
                    ? `<i data-lucide="star" class="w-3.5 h-3.5 fill-amberAccent text-amberAccent"></i>`
                    : `<i data-lucide="star" class="w-3.5 h-3.5 text-slate-600"></i>`;
            }
            const labels = { 1: "Accessible", 2: "Intermédiaire", 3: "Complexe" };
            return `${html}<span class="ml-1 text-[11px] text-slate-300">${labels[level]}</span>`;
        }

        // Filtrage & Rendu de la Sidebar
        function renderSidebarList() {
            const listContainer = document.getElementById("civ-list");
            const query = state.searchQuery.toLowerCase().trim();

            const filtered = CIVILIZATIONS.filter(civ => {
                const matchName = civ.name.toLowerCase().includes(query) || civ.tagline.toLowerCase().includes(query);
                const matchDlc = state.selectedDlc === "ALL" || civ.dlc === state.selectedDlc;
                const matchStyle = state.selectedStyle === "ALL" || civ.styles.includes(state.selectedStyle);
                return matchName && matchDlc && matchStyle;
            });

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8 px-4 text-slate-500 text-sm">
                        <i data-lucide="search-x" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                        Aucune civilisation ne correspond à ces filtres.
                    </div>`;
                lucide.createIcons();
                return;
            }

            listContainer.innerHTML = filtered.map(civ => {
                const isSelected = civ.id === state.selectedCivId;
                return `
                    <button onclick="selectCivilization('${civ.id}')" 
                        class="w-full text-left p-2.5 rounded-xl flex items-center gap-3 transition border ${
                            isSelected 
                                ? 'bg-royalGold/15 border-royalGold/50 text-white shadow-sm' 
                                : 'bg-slateCard/40 border-transparent hover:bg-slateHover hover:border-slate-700/80 text-slate-300'
                        }">
                        <span class="w-9 h-9 rounded-lg bg-slateDeep border border-slate-700/80 flex items-center justify-center text-lg shrink-0">
                            ${civ.emblem}
                        </span>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center justify-between gap-1">
                                <span class="font-semibold text-sm truncate ${isSelected ? 'text-royalGoldLight' : 'text-slate-100'}">${civ.name}</span>
                                <span class="text-[10px] text-amberAccent shrink-0">${"★".repeat(civ.difficulty)}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 truncate">${civ.styles.join(" • ")}</div>
                        </div>
                    </button>
                `;
            }).join("");

            lucide.createIcons();
        }

        // Sélection d'une civilisation
        function selectCivilization(civId) {
            state.selectedCivId = civId;
            const civ = CIVILIZATIONS.find(c => c.id === civId);
            if (!civ) return;

            // Fermer sidebar sur mobile
            closeMobileSidebar();

            // Mettre à jour l'en-tête
            document.getElementById("civ-name").textContent = civ.name;
            document.getElementById("civ-tagline").textContent = civ.tagline;
            document.getElementById("civ-summary").textContent = civ.summary;

        function renderBuildOrderTab(civ) {

                    </div>

                    <!-- Légende Répartition Villageois -->

                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span> Nourriture</span>
                            <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-600"></span> Bois</span>

                    <!-- Liste chronologique interactive -->

        // Gestion de la Checklist Build Order
        function toggleStepCheck(civId, idx) {
            const key = `${civId}_${idx}`;
            state.checkedSteps[key] = !state.checkedSteps[key];
            renderActiveTab();
        }

        // Gestion du Chronomètre Build Order
        function formatSeconds(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggleTimer() {
            if (state.timerRunning) {
                clearInterval(state.timerInterval);
                state.timerRunning = false;
            } else {
                state.timerRunning = true;
                state.timerInterval = setInterval(() => {
                    state.timerSeconds++;
                    const display = document.getElementById("bo-timer-display");
                    if (display) display.textContent = formatSeconds(state.timerSeconds);
                }, 1000);
            }
            renderActiveTab();
        }

        function resetTimer() {
            clearInterval(state.timerInterval);
            state.timerRunning = false;
            state.timerSeconds = 0;
            state.checkedSteps = {};
            renderActiveTab();
        }

        // Copie du Build Order (avec fallback document.execCommand('copy'))
        function copyBuildOrder(civId) {
            const civ = CIVILIZATIONS.find(c => c.id === civId);
            if (!civ) return;

            const lines = [
                `=== BUILD ORDER AoE IV : ${civ.name.toUpperCase()} ===`,
                `${civ.buildOrder.title}`,
                `Objectif : ${civ.buildOrder.objective}`,
                `Répartition : (Nourriture / Bois / Or / Pierre)`,
                "",
                ...civ.buildOrder.steps.map(s => `[${s.time}] (${s.age}) [${s.pop}] -> ${s.action}`)
            ];
            const text = lines.join("\n");

            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand("copy");
                showToast(`Build Order des ${civ.name} copié dans le presse-papier !`);
            } catch (err) {
                showToast("Impossible de copier automatiquement.", "warn");
            }
            document.body.removeChild(textarea);
        }

        // Comparateur de Civilisations
        function populateCompareSelects() {
            const selA = document.getElementById("compare-select-a");
            const selB = document.getElementById("compare-select-b");

            const optionsHtml = CIVILIZATIONS.map(c => `<option value="${c.id}">${c.emblem} ${c.name} (${c.dlc})</option>`).join("");
            selA.innerHTML = optionsHtml;
            selB.innerHTML = optionsHtml;
            selA.value = "english";
            selB.value = "french";

            selA.addEventListener("change", updateComparison);
            selB.addEventListener("change", updateComparison);
            updateComparison();
        }

        function updateComparison() {
            const idA = document.getElementById("compare-select-a").value;
            const idB = document.getElementById("compare-select-b").value;
            const civA = CIVILIZATIONS.find(c => c.id === idA);
            const civB = CIVILIZATIONS.find(c => c.id === idB);

            const renderCard = (c) => `
                <div class="bg-slateDeep rounded-xl border border-slate-800 p-4 space-y-4">
                    <div class="flex items-center gap-3 border-b border-slate-800 pb-3">
                        <span class="text-3xl">${c.emblem}</span>
                        <div>
                            <h4 class="font-display font-bold text-white text-lg">${c.name}</h4>
                            <p class="text-xs text-royalGold">${c.styles.join(" • ")}</p>
                        </div>
                    </div>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between"><span class="text-slate-400">Agression :</span><span class="font-bold text-crimsonAccent">${c.stats.aggression}/100</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Économie :</span><span class="font-bold text-emeraldAccent">${c.stats.economy}/100</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Défense :</span><span class="font-bold text-royalBlue">${c.stats.defense}/100</span></div>
                        <div class="flex justify-between"><span class="text-slate-400">Fin de partie :</span><span class="font-bold text-royalGold">${c.stats.lateGame}/100</span></div>
                    </div>
                    <div class="text-xs space-y-1.5 pt-2 border-t border-slate-800">
                        <span class="font-semibold text-slate-300 block">Mécanique Clé :</span>
                        <p class="text-slate-400 leading-relaxed">${c.mechanics.title}</p>
                    </div>
                    <div class="text-xs space-y-1.5 pt-2 border-t border-slate-800">
                        <span class="font-semibold text-emeraldAccent block">Points Forts :</span>
                        <ul class="list-disc pl-4 text-slate-400 space-y-1">
                            ${c.strengths.slice(0, 2).map(s => `<li>${s}</li>`).join("")}
                        </ul>
                    </div>
                </div>
            `;

            document.getElementById("compare-result").innerHTML = renderCard(civA) + renderCard(civB);
        }

        // Gestionnaires d'événements UI
        function closeMobileSidebar() {
            document.getElementById("civ-sidebar").classList.add("-translate-x-full");
            document.getElementById("sidebar-backdrop").classList.add("hidden");
        }

        function setupEventListeners() {
            // Recherche instantanée
            const searchInput = document.getElementById("search-civ");
            const clearBtn = document.getElementById("clear-search");

            searchInput.addEventListener("input", (e) => {
                state.searchQuery = e.target.value;
                clearBtn.classList.toggle("hidden", !state.searchQuery);
                renderSidebarList();
            });

            clearBtn.addEventListener("click", () => {
                state.searchQuery = "";
                searchInput.value = "";
                clearBtn.classList.add("hidden");
                renderSidebarList();
            });

            // Filtre DLC
            document.getElementById("filter-dlc").addEventListener("change", (e) => {
                state.selectedDlc = e.target.value;
                renderSidebarList();
            });

            // Filtres Styles de jeu
            document.querySelectorAll(".style-pill").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".style-pill").forEach(b => {
                        b.classList.remove("bg-royalGold/20", "text-royalGoldLight", "border-royalGold/40");
                        b.classList.add("bg-slateDeep", "text-slate-400", "border-slate-700/70");
                    });
                    btn.classList.remove("bg-slateDeep", "text-slate-400", "border-slate-700/70");
                    btn.classList.add("bg-royalGold/20", "text-royalGoldLight", "border-royalGold/40");
                    state.selectedStyle = btn.dataset.style;
                    renderSidebarList();
                });
            });

            // Onglets de contenu
            document.querySelectorAll(".tab-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    document.querySelectorAll(".tab-btn").forEach(b => {
                        b.classList.remove("tab-active");
                        b.classList.add("text-slate-400");
                    });
                    btn.classList.add("tab-active");
                    btn.classList.remove("text-slate-400");
                    state.activeTab = btn.dataset.tab;
                    renderActiveTab();
                });
            });

            // Sidebar Mobile
            document.getElementById("btn-toggle-sidebar").addEventListener("click", () => {
                document.getElementById("civ-sidebar").classList.remove("-translate-x-full");
                document.getElementById("sidebar-backdrop").classList.remove("hidden");
            });
            document.getElementById("btn-close-sidebar").addEventListener("click", closeMobileSidebar);
            document.getElementById("sidebar-backdrop").addEventListener("click", closeMobileSidebar);

            // Modal Comparateur
            const compareModal = document.getElementById("compare-modal");
            document.getElementById("btn-open-compare").addEventListener("click", () => {
                document.getElementById("compare-select-a").value = state.selectedCivId;
                updateComparison();
                compareModal.classList.remove("hidden");
                compareModal.classList.add("flex");
            });
            document.getElementById("btn-close-compare").addEventListener("click", () => {
                compareModal.classList.add("hidden");
                compareModal.classList.remove("flex");
            });
            compareModal.addEventListener("click", (e) => {
                if (e.target === compareModal) {
                    compareModal.classList.add("hidden");
                    compareModal.classList.remove("flex");
                }
            });
        }
    </script>
</body>
</html>
